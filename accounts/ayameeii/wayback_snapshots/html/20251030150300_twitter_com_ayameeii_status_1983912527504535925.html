<style type="text/css">
body {
				margin:0;
				padding: 20px;

			}

    z-index: 1000;
  }

  .tweet-container {

    border-radius: 12px;

    flex-direction: column;

    align-items: center;
    max-width: max-content;
  }

  .tweet-container > #nonjsonview {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;

  }

  .tweet-author {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.75rem;
  }

  .tweet-author-profile-image img {
    width: 48px;
    max-width: 48px;
    height: 48px;
    max-height: 48px;
    overflow: hidden;
    border-radius: 50%;
    margin-right: 5px;
  }

  .tweet-author-info {
    display: flex;
    flex-direction: column;
  }

  .tweet-author-name {
    font-weight: bold;
  }

  .tweet-content {
    font-size: 1.25rem;
  }

			.tweet-image {
				width: 100%;
				height: auto;
				margin-top: 12px;
				border-radius: 12px;
			}

			.embedded-tweet-container {

				background-color: white;

			}
			.date {
				font-size: 0.75rem;
				color: #657786;
				margin-top: 12px;
			}
			.date a {
				color: #657786;
				text-decoration: none;
			}
			.date a:hover {
				text-decoration: underline;
			}
  .on {
    display: block;
  }
  .off {
    display: none;
  }

<div class="tweet-container on">
<div id="nonjsonview">

  <div class="tweet-content">
  起雾了 白茫茫的一片 不过天未完全亮的时候 雾带着一抹灰色
  <br/>
  那时灰白的雾掩盖着什么 窗外传来稀疏的雨声却什么也看不见 隐隐约约是树的影子
  <br/>
  In my restless dreams...
  <br/>
  只是并没有做梦
  <br/>
  但这样的天气我可以假装心安理得的坐在这里，看不见就是不存在地等待时间流逝——没有人来打扰 看不见的最让人安心
